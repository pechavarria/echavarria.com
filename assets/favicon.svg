<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Browser icon: gold E on the crest's navy-black, in a rounded square.
    A single letter rather than "EB" because two glyphs turn to mush at 16px.
    Fonts are declared explicitly - an icon file has no page styles to inherit.
  -->
  <defs>
    <linearGradient id="fvGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f6e3ad"/>
      <stop offset=".45" stop-color="#d8ae55"/>
      <stop offset="1"   stop-color="#a87f2c"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="21" fill="#0b1120"/>
  <rect x="5.5" y="5.5" width="89" height="89" rx="16.5"
        fill="none" stroke="url(#fvGold)" stroke-width="3.5" opacity=".85"/>

  <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="62" font-weight="700" fill="url(#fvGold)">E</text>
</svg>
